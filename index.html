<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Calculator</title>
 <link rel="stylesheet" href="css/style.css">
 <link rel="stylesheet" href="css/reset.css">
</head>

<body>
 <div id="container">
  <input type="text" id="display" readonly><br>
  <div id="btn-layout">
   <button class="btn-input" data-value="7">7</button>
   <button class="btn-input" data-value="8">8</button>
   <button class="btn-input" data-value="9">9</button>
   <button class="btn-input" data-value="divide">/</button>
   <button class="btn-input" data-value="4">4</button>
   <button class="btn-input" data-value="5">5</button>
   <button class="btn-input" data-value="6">6</button>
   <button id="mult" data-value="multiply">x</button>
   <button class="btn-input" data-value="1">1</button>
   <button class="btn-input" data-value="2">2</button>
   <button class="btn-input" data-value="3">3</button>
   <button class="btn-input" data-value="add">+</button>
   <button class="btn-input" data-value="0">0</button>
   <button class="btn-input" data-value="decimal">.</button>
   <button id="equals" data-value="equals">=</button>
   <button class="btn-input" data-value="subtract">-</button>
  </div>

 </div>

 <script src="js/main.js"></script>
</body>

</html>
