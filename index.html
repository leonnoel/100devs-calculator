<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="Your description goes here">
	<meta name="keywords" content="one, two, three">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Tiny Calculator</title>

	<!-- external CSS link -->
	<link rel="stylesheet" href="css/normalize.css">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<main class="calcCase">
		<section class="screen">0</section>

		<div class="row">
			<button class="number">7</button>
			<button class="number">8</button>
			<button class="number">9</button>
			<button class="operator div">/</button>
		</div>
		<div class="row">
			<button class="number">4</button>
			<button class="number">5</button>
			<button class="number">6</button>
			<button class="operator mult">*</button>
		</div>
		<div class="row">
			<button class="number">1</button>
			<button class="number">2</button>
			<button class="number">3</button>
			<button class="operator plus">+</button>
		</div>
		<div class="row">
			<button class="number">0</button>
			<button class="number dot">.</button>
			<button class="equal">=</button>
			<button class="operator min">-</button>
		</div>
		<div class="row">
			
			<button class="clear">C</button>
		</div>
	</main>


	<script type="text/javascript" src="js/main.js"></script>
</body>

</html>
