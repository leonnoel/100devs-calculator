<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="cal">
        <div class="bigScreen"></div>
        <section class="calculatorButton">
            <div class="firstRow">
                <button class="clearBtn">AC</button>
            </div>
            <div class="secondRow">
                <button class="numberBtn" value="7">7</button>
                <button class="numberBtn" value="8">8</button>
                <button class="numberBtn" value="9">9</button>
                <button class="operationsBtn" value="/">/</button>
            </div>
            <div class="thirdRow">
                <button class="numberBtn" value="4">4</button>
                <button class="numberBtn" value="5">5</button>
                <button class="numberBtn" value="6">6</button>
                <button class="operationsBtn" value="*">x</button>
            </div>
            <div class="fourthRow">
                <button class="numberBtn" value="1">1</button>
                <button class="numberBtn" value="2">2</button>
                <button class="numberBtn" value="3">3</button>
                <button class="operationsBtn" value="+">+</button>
            </div>
            <div class="fifthRow">
                <button class="numberBtn" value="0">0</button>
                <button class="numberBtn" value=".">.</button>
                <button class="equal" value="=">=</button>
                <button class="operationsBtn" value="-">-</button>
            </div>
        </section>
    </div>

<script src="js/main.js"></script> 
</body>
</html>
