<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Simple Calculator</title>
</head>
<body>
    <section class="calculatorWrapper">
        <img src="./calculator.jpg" alt="calculator image">
        <input type="text" id="calcDisplay" autofocus>

        <div class="keypadOverlay">
            <button class="calcBtn" dataVal="7"></button>
            <button class="calcBtn" dataVal="8"></button>
            <button class="calcBtn" dataVal="9"></button>
            <button class="calcBtn" dataVal="/"></button>

            <button class="calcBtn" dataVal="4"></button>
            <button class="calcBtn" dataVal="5"></button>
            <button class="calcBtn" dataVal="6"></button>
            <button class="calcBtn" dataVal="*"></button>

            <button class="calcBtn" dataVal="1"></button>
            <button class="calcBtn" dataVal="2"></button>
            <button class="calcBtn" dataVal="3"></button>
            <button class="calcBtn" dataVal="+"></button>

            <button class="calcBtn" dataVal="0"></button>
            <button class="calcBtn" dataVal="."></button>
            <button class="calcBtn" dataVal="="></button>
            <button class="calcBtn" dataVal="-"></button>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
