<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator OOP</title>
  <link href="styles.css" rel="stylesheet">
 
</head>
<body>
  <div class="main">
    <div class="rectangle">
      
    </div>
    <div class="buttons">
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>/</button>
    </div>
    <div class="buttons">
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>*</button>
    </div>
    <div class="buttons">
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>+</button>
    </div>
    <div class="buttons">
      <button>0</button>
      <button>.</button>
      <button class="equals">=</button>
      <button>-</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
