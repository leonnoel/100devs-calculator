<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/main.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="div-outer">
        <div class="div-output">

        </div>
        
        <div class="div-grp-keypad">
            <div class="div-row">
                <div class="div-keys">
                    <span class="btn">7</span>
                </div>
                <div class="div-keys">
                    <span class="btn">8</span>
                </div>
                <div class="div-keys">
                    <span class="btn">9</span>
                </div>
                <div class="div-keys">
                    <span class="btn">/</span>
                </div>
            </div>

            <div class="div-row">
                <div class="div-keys">
                    <span class="btn">4</span>
                </div>
                <div class="div-keys">
                    <span class="btn">5</span>
                </div>
                <div class="div-keys">
                    <span class="btn">6</span>
                </div>
                <div class="div-keys">
                    <span class="btn">*</span>
                </div>
            </div>

            <div class="div-row">
                <div class="div-keys">
                    <span class="btn">1</span>
                </div>
                <div class="div-keys">
                    <span class="btn">2</span>
                </div>
                <div class="div-keys">
                    <span class="btn">3</span>
                </div>
                <div class="div-keys">
                    <span class="btn">+</span>
                </div>
            </div>

            <div class="div-row">
                <div class="div-keys">
                    <span class="btn">0</span>
                </div>
                <div class="div-keys">
                    <span class="btn">.</span>
                </div>
                <div class="div-keys">
                    <span class="btn">=</span>
                </div>
                <div class="div-keys">
                    <span class="btn">-</span>
                </div>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
