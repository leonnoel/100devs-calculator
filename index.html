<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- external CSS link -->
	<link rel="stylesheet" href="css/normalize.css">
	<link rel="stylesheet" href="css/style.css">
    <title>Calculator</title>
</head>
<body>
    <section id="calculator">
        <h1 id="result">0</h1>
        <section id="keypad">
            <h2 class="key number" id="7">7</h2>
            <h2 class="key number" id="8">8</h2>
            <h2 class="key number" id="9">9</h2>
            <h2 class="key operation" id="/">/</h2>
            <h2 class="key number" id="4">4</h2>
            <h2 class="key number" id="5">5</h2>
            <h2 class="key number" id="6">6</h2>
            <h2 class="key operation" id="X">X</h2>
            <h2 class="key number" id="1">1</h2>
            <h2 class="key number" id="2">2</h2>
            <h2 class="key number" id="3">3</h2>
            <h2 class="key operation" id="+">+</h2>
            <h2 class="key number" id="0">0</h2>
            <h2 class="key number" id=".">.</h2>
            <h2 class="key equals" id="=">=</h2>
            <h2 class="key operation" id="-">-</h2>
        </section>
        <h1 id="clear">CLEAR</h1>
    </section>
	<script type="text/javascript" src="main.js"></script>
</body>
</html>
